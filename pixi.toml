[workspace]
name = "pyFlowStims"
version = "0.1.0"
description = "Python port of FlowStims: generates visual-stimulation movie frames"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10"
numpy = ">=1.24"
scipy = ">=1.10"
pillow = ">=10.0"

[tasks]
render = "python flowstims.py"
